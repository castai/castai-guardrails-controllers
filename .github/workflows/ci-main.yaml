name: CI Main

on:
  push:
    branches:
      - main
    paths:
      - 'controllers/tsc-controller/**'
      - 'controllers/jvm-probe-controller/**'
      - '.github/workflows/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      tsc: ${{ steps.filter.outputs.tsc }}
      jvm: ${{ steps.filter.outputs.jvm }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Detect changed controllers
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1b284cd68cea36 # v3.0.2
        with:
          filters: |
            tsc:
              - 'controllers/tsc-controller/**'
              - '.github/workflows/**'
            jvm:
              - 'controllers/jvm-probe-controller/**'
              - '.github/workflows/**'

  tsc-controller-latest:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.tsc == 'true' }}
    uses: ./.github/workflows/_release-image.yaml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      image_name: castai-tsc-controller
      context: .
      dockerfile: controllers/tsc-controller/Dockerfile
      version: latest

  jvm-probe-controller-latest:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.jvm == 'true' }}
    uses: ./.github/workflows/_release-image.yaml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      image_name: castai-jvm-probe-controller
      context: .
      dockerfile: controllers/jvm-probe-controller/Dockerfile
      version: latest
