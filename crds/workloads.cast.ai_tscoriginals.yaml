---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tscoriginals.workloads.cast.ai
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
    helm.sh/resource-policy: keep
spec:
  group: workloads.cast.ai
  names:
    kind: TSCOriginal
    listKind: TSCOriginalList
    plural: tscoriginals
    singular: tscoriginal
    shortNames:
      - tsco
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Target
          type: string
          jsonPath: .spec.targetRef.kind
        - name: Workload
          type: string
          jsonPath: .spec.targetRef.name
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: RolledBack
          type: string
          jsonPath: .status.conditions[?(@.type=="RolledBack")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - targetRef
                - capturedAt
              properties:
                targetRef:
                  type: object
                  required:
                    - apiVersion
                    - kind
                    - namespace
                    - name
                    - uid
                  properties:
                    apiVersion: {type: string}
                    kind: {type: string}
                    namespace: {type: string}
                    name: {type: string}
                    uid: {type: string}
                originalTSCs:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                originalTSCsPresent:
                  type: boolean
                capturedAt:
                  type: string
                  format: date-time
                controllerVersion:
                  type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
                      observedGeneration: {type: integer, format: int64}
                observedGeneration:
                  type: integer
                  format: int64
