# Default values for castai-tsc-controller
# This chart deploys the CAST AI Topology Spread Constraints Controller

replicaCount: 2

image:
  # GCP Artifact Registry (castai-hub). Use imagePullSecrets on the pod if required for your cluster.
  repository: us-docker.pkg.dev/castai-hub/library/castai-tsc-controller
  tag: "0.0.2"
  # Container image pull policy
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

config:
  defaultConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
  # Skip workloads with single replica (default: true)
  skipSingleReplica: true
  # Controller scan/reconcile interval (e.g., "2m", "5m")
  reconcileInterval: "2m"
  # Garbage collection interval for stale annotations (e.g., "5m", "10m")
  garbageCollectInterval: "5m"
  # Application log level: debug, info, warn (or warning), error
  logLevel: "info"
  # NOTE: config.enableTSCManagement and config.dryRun are deprecated and
  # removed from the rendered ConfigMap. The controller accepts them for
  # backward compatibility (mapped to management.enabled and management.mode
  # respectively, with a deprecation warning logged). Use management.enabled
  # and management.mode below instead.
  # Exclusion rules for workloads to skip TSC injection
  # Each rule is evaluated independently; if a workload matches ANY rule, no TSC is injected
  # Within a single rule, all specified criteria (namespaceRegex, nameRegex, labels) must match (AND logic)
  # Regular expression patterns are used for flexible matching
  # Empty strings for namespaceRegex or nameRegex, or empty object {} for labels, mean "no filter" for that criterion
  exclusions:
    - namespaceRegex: "^kube-.*"
      nameRegex: ""
      labels: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: castai-tsc-controller
          topologyKey: kubernetes.io/hostname

service:
  enabled: false
  type: ClusterIP
  port: 8080

metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s

rbac:
  create: true

# Rollback snapshot behavior — see docs/rollback-operator-runbook.md
snapshot:
  # If true, controller captures workload state to a TSCOriginal CRD before
  # patching. Required for rollback to work. Recommended: true in Prod.
  enabled: true

# Runtime behavior toggles — hot-reloaded via ConfigMap watch.
management:
  # Master switch. When false, controller stops making new patches. Existing
  # patched workloads keep their patches unless rollbackOnDisable=true.
  enabled: true

  # Only meaningful when enabled=false. When true, flipping enabled from true
  # to false triggers a one-shot rollback loop that restores every snapshotted
  # workload. CRDs are kept post-rollback with status.conditions[RolledBack]=True.
  rollbackOnDisable: false

  # Operation mode (orthogonal to enabled):
  #   apply     — controller mutates workloads (default, today's behaviour).
  #   recommend — controller observes and captures snapshots but does NOT
  #               patch. Useful for first-Prod-install dry run.
  mode: apply

# CRD chart control — set false only if you install CRDs out-of-band.
# Defaults to false because install.sh installs CRDs as a separate release
# (castai-guardrails-crds) to avoid ownership conflicts between controllers.
crds:
  enabled: false

# Pod disruption budget for the controller
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Priority class for the controller pods
priorityClassName: ""

# Update strategy for the deployment
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
