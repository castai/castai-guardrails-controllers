# Default values for castai-tsc-controller
# This chart deploys the CAST AI Topology Spread Constraints Controller

replicaCount: 2

image:
  # GitHub Container Registry. Use imagePullSecrets on the pod if required for your cluster.
  repository: ghcr.io/castai/images/castai-tsc-controller
  tag: "0.2.15"
  # Container image pull policy
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

config:
  defaultConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
  # Skip workloads with single replica (default: true)
  skipSingleReplica: true
  # Controller scan/reconcile interval (e.g., "2m", "5m")
  reconcileInterval: "2m"
  # Garbage collection interval for stale annotations (e.g., "5m", "10m")
  garbageCollectInterval: "5m"
  # Application log level: debug, info, warn (or warning), error
  logLevel: "info"
  # NOTE: config.enableTSCManagement and config.dryRun are deprecated and
  # removed from the rendered ConfigMap. The controller accepts them for
  # backward compatibility (mapped to management.enabled and management.mode
  # respectively, with a deprecation warning logged). Use management.enabled
  # and management.mode below instead.
  # Exclusion rules for workloads to skip TSC injection
  # Each rule is evaluated independently; if a workload matches ANY rule, no TSC is injected
  # Within a single rule, all specified criteria (namespaceRegex, nameRegex, labels) must match (AND logic)
  # Regular expression patterns are used for flexible matching
  # Empty strings for namespaceRegex or nameRegex, or empty object {} for labels, mean "no filter" for that criterion
  exclusions:
    - namespaceRegex: "^kube-.*"
      nameRegex: ""
      labels: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: castai-tsc-controller
          topologyKey: kubernetes.io/hostname

service:
  enabled: true
  type: ClusterIP
  port: 443
  targetPort: 8443

# Webhook server configuration
webhook:
  # Master switch for the pod-mutating admission webhook.
  enabled: true
  # Listen address inside the container.
  addr: ":8443"
  # admissionReviewTimeoutSeconds surfaced to the API server.
  timeoutSeconds: 5
  # failurePolicy: Ignore keeps Pod creation unblocked if the webhook is down.
  # Set to Fail after operational confidence for strict enforcement.
  failurePolicy: Ignore
  # reinvocationPolicy controls whether the webhook is re-invoked after other
  # mutating webhooks. Never is the safe default for our copy-style mutation.
  reinvocationPolicy: Never
  # Optional scope restrictions. Empty maps mean the webhook applies to all
  # Pods cluster-wide (subject to RBAC of the api server invoking it).
  namespaceSelector: {}
  objectSelector: {}
  # Manual CA bundle override. When empty, the chart expects cert-manager to
  # inject the CA bundle via the cert-manager.io/inject-ca-from annotation.
  # Set this when tls.manualSecret.enabled=true so the API server trusts the
  # certificate supplied via the operator-managed Secret.
  caBundle: ""

# Plain-HTTP health server for kubelet probes. Kept separate from the
# HTTPS webhook so kubelet's TCP-style probes do not produce spurious
# TLS-handshake EOF errors against the admission listener. Only /healthz
# is served from this port; /metrics and the mutate endpoint remain on
# the encrypted webhook port.
#
# The health port and the HTTP readiness/liveness probes are rendered
# inside the `{{- if .Values.webhook.enabled }}` block in the Deployment
# template, so they are not created when the webhook is disabled.
health:
  # Listen address inside the container.
  addr: ":8080"
  # Container port exposed for the health server. Must match the address
  # port component above so kubelet probes can reach /healthz.
  port: 8080

# cert-manager integration. When enabled, a Certificate resource is rendered
# and the MutatingWebhookConfiguration uses the cert-manager CA injection
# annotation. The referenced issuer must already exist in the cluster.
#
# Defaults align with install.sh (which installs a self-signed ClusterIssuer
# named castai-guardrails-selfsigned) so that `helm install` works out of the
# box when cert-manager is present.
#
# IMPORTANT: exactly one of the following must be supplied, otherwise the
# API server will not trust the webhook and pod mutations will be ignored
# (failurePolicy is Ignore):
#   - cert-manager:    certManager.enabled=true AND certManager.issuerRef.name set
#                      (recommended; uses cert-manager.io/inject-ca-from)
#   - manual secret:   tls.manualSecret.enabled=true AND tls.manualSecret.name
#                      set to an existing TLS Secret (you supply tls.crt/tls.key
#                      and chart does not render a Certificate)
#   - explicit bundle: webhook.caBundle set to a base64-encoded PEM CA bundle
certManager:
  enabled: true
  issuerRef:
    # Name of the cert-manager Issuer / ClusterIssuer. install.sh ships a
    # self-signed ClusterIssuer named castai-guardrails-selfsigned.
    name: castai-guardrails-selfsigned
    kind: ClusterIssuer
    # group is omitted by default (cert-manager.io is the default API group).
    group: ""

# Manual TLS fallback. Use this when the cluster does not have cert-manager.
# The operator MUST create the referenced Secret with tls.crt and tls.key
# before installing this chart; the chart does not render or manage the
# Secret (this prevents Helm from overwriting operator-supplied certificate
# data on `helm upgrade`). Example:
#
#   kubectl -n <release-namespace> create secret tls <tls.manualSecret.name> \
#     --cert=tls.crt --key=tls.key
#
# If the Secret is missing or its tls.crt/tls.key are empty, webhook pods
# will fail readiness and Pod mutations will not be served.
tls:
  manualSecret:
    enabled: false
    # Required when manualSecret.enabled is true. The Secret must already
    # exist in the release namespace.
    name: ""

metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s

rbac:
  create: true

# Rollback snapshot behavior — see docs/rollback-operator-runbook.md
snapshot:
  # If true, controller captures workload state to a TSCOriginal CRD before
  # patching. Required for rollback to work. Recommended: true in Prod.
  enabled: true

# Runtime behavior toggles — hot-reloaded via ConfigMap watch.
management:
  # Master switch. When false, controller stops making new patches. Existing
  # patched workloads keep their patches unless rollbackOnDisable=true.
  enabled: true

  # Only meaningful when enabled=false. When true, flipping enabled from true
  # to false triggers a one-shot rollback loop that restores every snapshotted
  # workload. CRDs are kept post-rollback with status.conditions[RolledBack]=True.
  rollbackOnDisable: false

  # Operation mode (orthogonal to enabled):
  #   apply     — controller mutates workloads.
  #   recommend — controller observes and captures snapshots but does NOT
  #               patch. This is the default so a fresh install captures
  #               original workload state without mutating workloads;
  #               operators must explicitly patch management.mode to apply
  #               before the controller makes changes.
  mode: recommend

# CRD chart control — set false only if you install CRDs out-of-band.
# Defaults to false because install.sh installs CRDs as a separate release
# (castai-guardrails-crds) to avoid ownership conflicts between controllers.
crds:
  enabled: false

# Pod disruption budget for the controller
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Priority class for the controller pods
priorityClassName: ""

# Update strategy for the deployment
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
