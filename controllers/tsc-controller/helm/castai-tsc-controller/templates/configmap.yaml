apiVersion: v1
kind: ConfigMap
metadata:
  name: castai-tsc-controller-config
  namespace: {{ .Release.Namespace | default "castai-agent" }}
  labels:
    {{- include "castai-tsc-controller.labels" . | nindent 4 }}
data:
  defaultConstraints: '{{ include "castai-tsc-controller.constraintsJson" . }}'
  skipSingleReplica: "{{ .Values.config.skipSingleReplica }}"
  logInterval: "{{ .Values.config.logInterval }}"
  reconcileInterval: "{{ .Values.config.reconcileInterval }}"
  garbageCollectInterval: "{{ .Values.config.garbageCollectInterval }}"

  # Rollback and management state (hot-reloaded)
  # NOTE: dryRun and enableTSCManagement are deprecated; the controller still
  # accepts them via backward-compatible parsing.
  managementEnabled: "{{ .Values.management.enabled }}"
  rollbackOnDisable: "{{ .Values.management.rollbackOnDisable }}"
  mode: "{{ .Values.management.mode }}"
  snapshotEnabled: "{{ .Values.snapshot.enabled }}"
  operatorNamespace: "{{ .Release.Namespace | default "castai-agent" }}"
  {{- if .Values.config.exclusions }}
  exclusions: '{{ .Values.config.exclusions | toJson }}'
  {{- else }}
  exclusions: "[]"
  {{- end }}