{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "castai-tsc-controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | default "castai-agent" }}
  labels:
    {{- include "castai-tsc-controller.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "castai-tsc-controller.fullname" . }}
  labels:
    {{- include "castai-tsc-controller.labels" . | nindent 4 }}
rules:
  # Read-only access to Deployments/StatefulSets/ReplicaSets is retained for
  # owner-reference lookups (webhook admission path) and rollback of legacy
  # workloads that were patched by the previous controller version.
  # The "patch" verb is retained on Deployments/StatefulSets so the
  # rollback path (applyInversePatch, removeTSCFromWorkload) and the
  # startup managed-annotation reconciler (reconcileOneManagedWorkload)
  # can continue to undo legacy patches.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "castai-tsc-controller.fullname" . }}
  labels:
    {{- include "castai-tsc-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "castai-tsc-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "castai-tsc-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace | default "castai-agent" }}
---
# Namespaced Role for TSCOriginal CRDs (rollback snapshots live here).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "castai-tsc-controller.fullname" . }}-originals
  namespace: {{ .Release.Namespace | default "castai-agent" }}
  labels:
    {{- include "castai-tsc-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: ["workloads.cast.ai"]
    resources: ["tscoriginals"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["workloads.cast.ai"]
    resources: ["tscoriginals/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["workloads.cast.ai"]
    resources: ["tscoriginals/finalizers"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "castai-tsc-controller.fullname" . }}-originals
  namespace: {{ .Release.Namespace | default "castai-agent" }}
  labels:
    {{- include "castai-tsc-controller.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "castai-tsc-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace | default "castai-agent" }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "castai-tsc-controller.fullname" . }}-originals
{{- end }}