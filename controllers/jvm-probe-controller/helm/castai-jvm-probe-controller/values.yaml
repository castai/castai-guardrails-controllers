# Default values for castai-jvm-probe-controller
# This chart deploys the CAST AI JVM Probe Controller

replicaCount: 2

image:
  # GCP Artifact Registry (castai-hub). Use imagePullSecrets on the pod if required for your cluster.
  repository: us-docker.pkg.dev/castai-hub/library/castai-jvm-probe-controller
  tag: ""  # empty -> falls back to Chart.yaml appVersion (currently 0.0.14)
  # Container image pull policy
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Controller configuration (new format matching v1.1.0)
config:
  # Framework configurations (structured YAML, converted to JSON for ConfigMap)
  frameworks:
    spring-boot:
      livenessPath: "/actuator/health/liveness"
      readinessPath: "/actuator/health/readiness"
      startupPath: "/actuator/health"
      defaultPort: 8080
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
      useTCPSocket: false
    quarkus:
      livenessPath: "/q/health/live"
      readinessPath: "/q/health/ready"
      startupPath: "/q/health/started"
      defaultPort: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
      useTCPSocket: false
    micronaut:
      livenessPath: "/health/liveness"
      readinessPath: "/health/readiness"
      startupPath: "/health"
      defaultPort: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
      useTCPSocket: false
    generic:
      livenessPath: ""
      readinessPath: ""
      startupPath: ""
      defaultPort: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
      useTCPSocket: true

  # P1: Liveness probe safety - opt-in by default (requires actuator sub-groups enabled)
  injectLivenessProbe: "false"
  injectReadinessProbe: "true"
  injectStartupProbe: "true"

  logIntendedChanges: "true"
  # NOTE: config.dryRun and config.enableProbeManagement are deprecated and
  # removed from the rendered ConfigMap. The controller accepts them for
  # backward compatibility (mapped to management.enabled and management.mode
  # respectively, with a deprecation warning logged). Use management.enabled
  # and management.mode below instead.

  # Existing settings
  requireBothProbes: "true"
  skipIfAnyProbeExists: "true"
  logInterval: "15m"
  reconcileInterval: "2m"
  exclusions:
    - namespaceRegex: "^kube-.*"

# Rollback snapshot behavior — see docs/rollback-operator-runbook.md
snapshot:
  # If true, controller captures workload probe state to a JVMProbeOriginal CRD
  # before patching. Required for rollback to work. Recommended: true in Prod.
  enabled: true

# Runtime behavior toggles — hot-reloaded via ConfigMap watch.
management:
  # Master switch. When false, controller stops making new patches. Existing
  # patched workloads keep their patches unless rollbackOnDisable=true.
  enabled: true

  # Only meaningful when enabled=false. When true, flipping enabled from true
  # to false triggers a one-shot rollback loop that restores every snapshotted
  # workload. CRDs are kept post-rollback with status.conditions[RolledBack]=True.
  rollbackOnDisable: false

  # Operation mode (orthogonal to enabled):
  #   apply — controller mutates workloads.
  mode: apply

# CRD chart control — set false only if you install CRDs out-of-band.
# Defaults to false because install.sh installs CRDs as a separate release
# (castai-guardrails-crds) to avoid ownership conflicts between controllers.
crds:
  enabled: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: castai-jvm-probe-controller
          topologyKey: kubernetes.io/hostname

service:
  enabled: true
  type: ClusterIP
  port: 443
  targetPort: 8443

# Webhook server configuration
webhook:
  # Master switch for the pod-mutating admission webhook.
  enabled: true
  # Listen address inside the container.
  addr: ":8443"
  # admissionReviewTimeoutSeconds surfaced to the API server.
  timeoutSeconds: 5
  # failurePolicy: Ignore keeps Pod creation unblocked if the webhook is down.
  # Set to Fail after operational confidence for strict enforcement.
  failurePolicy: Ignore
  # reinvocationPolicy controls whether the webhook is re-invoked after other
  # mutating webhooks. Never is the safe default for our copy-style mutation.
  reinvocationPolicy: Never
  # Optional scope restrictions. Empty maps mean the webhook applies to all
  # Pods cluster-wide (subject to RBAC of the api server invoking it).
  namespaceSelector: {}
  objectSelector: {}

# cert-manager integration. When enabled, a Certificate resource is rendered
# and the MutatingWebhookConfiguration uses the cert-manager CA injection
# annotation. The referenced issuer must already exist in the cluster.
certManager:
  enabled: true
  issuerRef:
    # Name of the cert-manager Issuer / ClusterIssuer.
    name: ""
    kind: ClusterIssuer
    # group is omitted by default (cert-manager.io is the default API group).
    group: ""

# Manual TLS fallback. Use this when the cluster does not have cert-manager.
# The operator MUST create the referenced Secret with tls.crt and tls.key
# before installing this chart; the chart does not render or manage the
# Secret (this prevents Helm from overwriting operator-supplied certificate
# data on `helm upgrade`). Example:
#
#   kubectl -n <release-namespace> create secret tls <tls.manualSecret.name> \
#     --cert=tls.crt --key=tls.key
#
# If the Secret is missing or its tls.crt/tls.key are empty, webhook pods
# will fail readiness and Pod mutations will not be served.
tls:
  manualSecret:
    enabled: false
    # Required when manualSecret.enabled is true. The Secret must already
    # exist in the release namespace.
    name: ""

metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s

rbac:
  create: true

# Pod disruption budget for the controller
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Priority class for the controller pods
priorityClassName: ""

# Update strategy for the deployment
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
