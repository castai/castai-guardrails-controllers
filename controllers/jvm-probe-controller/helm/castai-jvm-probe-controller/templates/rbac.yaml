{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "castai-jvm-probe-controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | default "castai-agent" }}
  labels:
    {{- include "castai-jvm-probe-controller.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "castai-jvm-probe-controller.fullname" . }}
  labels:
    {{- include "castai-jvm-probe-controller.labels" . | nindent 4 }}
rules:
  # Read-only access to Deployments/StatefulSets is retained for diagnostics.
  # Patch and update verbs were removed during the migration to webhook mode
  # (see migration plan decision log #4).
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  # ConfigMap watch powers hot-reload of the controller configuration.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Event recorder for webhook lifecycle / scrape errors.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "list", "watch"]
  # Leader-election leases (retained for backward compatibility; the webhook
  # server does not require leadership, see migration plan decision log #13).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "castai-jvm-probe-controller.fullname" . }}
  labels:
    {{- include "castai-jvm-probe-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "castai-jvm-probe-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "castai-jvm-probe-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace | default "castai-agent" }}
{{- end }}
